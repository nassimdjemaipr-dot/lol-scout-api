services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # FPM et les commandes lancees via docker compose exec tournent sous le meme
    # utilisateur : sinon la console, en root, cree des dossiers dans var/ que
    # php-fpm ne peut plus ecrire.
    user: "www-data"
    volumes:
      - .:/var/www/html
      # vendor/ et var/ vivent dans des volumes nommes, donc dans le systeme de
      # fichiers Linux et non sur le montage Windows. 6 574 fichiers PHP que
      # opcache re-verifie sinon a chaque revalidation, a travers le pont
      # Docker Desktop : c est la cause des temps de reponse de 4 a 9 secondes.
      - vendor_data:/var/www/html/vendor
      - var_data:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  front:
    # Le front vit dans un depot separe, clone a cote de celui-ci.
    # Procedure complete : voir DEPLOYMENT.md.
    build:
      context: ../lol-scout-front
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:80"
    depends_on:
      - nginx

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lolscout
      MYSQL_USER: app
      MYSQL_PASSWORD: "!ChangeMe!"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  vendor_data:
  var_data:
