; Reglages opcache pour le developpement local.
;
; validate_timestamps reste actif : sans lui, une modification de src/ ne serait
; pas prise en compte sans redemarrer le conteneur. En revanche la frequence de
; revalidation passe de 2 a 15 secondes, ce qui divise par sept le nombre de
; verifications de dates de fichiers.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 15

; 6 574 fichiers PHP rien que dans vendor/ : la valeur par defaut de 10 000
; laisse trop peu de marge, et un depassement fait retomber opcache en
; compilation a chaque requete.
opcache.max_accelerated_files = 30000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16

; Le realpath cache evite de re-resoudre les chemins a chaque inclusion.
; Determinant lorsque le code est servi depuis un montage lent.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
